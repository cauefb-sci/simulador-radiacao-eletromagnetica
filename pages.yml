name: Publicar simulador no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar pygbag e pygame-ce
        run: python -m pip install --upgrade pip pygbag pygame-ce

      - name: Gerar a versão web
        run: python -m pygbag --build .

      - name: Criar index.html
        shell: bash
        run: |
          set -e
          html_file=$(find build/web -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | head -n 1)
          if [ -z "$html_file" ]; then
            echo 'Nenhum arquivo HTML foi gerado pelo pygbag.'
            find build/web -maxdepth 2 -type f | sort | head -100
            exit 1
          fi
          cp "$html_file" build/web/index.html
          echo "Página principal: $html_file"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
