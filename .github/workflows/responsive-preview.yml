name: Validar prototipo responsivo

on:
  push:
    branches:
      - responsive-canvas-prototype

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verificar sintaxe Python
        run: python -m py_compile main.py

      - name: Instalar pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.3

      - name: Construir pacote web
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pygbag --build --ume_block=0 .

      - name: Guardar build para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: responsive-preview-web
          path: build/web
